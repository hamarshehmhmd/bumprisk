name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.11", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install . pytest
      - run: pytest -q

  live:
    name: live registries (npm, PyPI, OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install . pytest
      - run: pytest -q tests/test_live.py
        env: {BUMPRISK_LIVE: "1"}
      - name: real example must fail the build
        run: |
          set +e; bumprisk compare examples/npm/old/package-lock.json examples/npm/new/package-lock.json; rc=$?; set -e
          test $rc -eq 1

  action:
    name: GitHub Action (uses ./)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          args: compare examples/npm/old/package-lock.json examples/npm/new/package-lock.json
          fail-on: never

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: BUMPRISK_REF=${{ github.sha }} sh install.sh
      - run: ~/.local/bin/bumprisk --version || bumprisk --version
