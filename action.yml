name: bumprisk
description: "Flag risky dependency changes: removed/malicious versions, fresh releases, install scripts, lost provenance, new vulns."
author: Mohammad Hamarsheh
branding:
  icon: shield
  color: red
inputs:
  args:
    description: Command-line words for bumprisk. Quotes and backslashes group words; shell syntax is literal. Default compares the PR's lockfiles against the base branch.
    default: diff
  fail-on:
    description: critical | high | medium | low | never
    default: high
  cooldown:
    description: Flag versions younger than this many days
    default: "7"
runs:
  using: composite
  steps:
    # Pass inputs only through the environment. Never paste action inputs into
    # a run script: the runner substitutes them before bash parses the script,
    # and double quotes do not stop command substitution. The entrypoint
    # splits BUMPRISK_ARGS with shlex and does not evaluate shell syntax.
    - shell: bash
      env:
        BUMPRISK_ACTION_PATH: ${{ github.action_path }}
      run: python3 -m pip install --quiet --disable-pip-version-check "$BUMPRISK_ACTION_PATH" || python3 -m pip install --quiet --break-system-packages "$BUMPRISK_ACTION_PATH"
    - shell: bash
      env:
        BUMPRISK_ARGS: ${{ inputs.args }}
        BUMPRISK_FAIL_ON: ${{ inputs['fail-on'] }}
        BUMPRISK_COOLDOWN: ${{ inputs.cooldown }}
      run: python3 -m bumprisk.action
